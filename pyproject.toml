[project]
name = "music-select"
version = "0.1.0"
description = "A keyboard-driven terminal MP3 browser and player."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
